name: Code Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      primary: ${{ steps.versions.outputs.primary }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Derive primary Python version from pyproject.toml classifiers
        id: versions
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import re, tomllib
          with open("pyproject.toml", "rb") as f:
              classifiers = tomllib.load(f)["project"]["classifiers"]
          pat = re.compile(r"^Programming Language :: Python :: (\d+\.\d+)$")
          vers = sorted(
              {m.group(1) for c in classifiers if (m := pat.match(c))},
              key=lambda v: tuple(map(int, v.split("."))),
          )
          if not vers:
              raise SystemExit("No 'Programming Language :: Python :: X.Y' classifiers found in pyproject.toml")
          print(f"primary={vers[0]}")
          EOF

  quality:
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras --python ${{ needs.setup.outputs.primary }}

      - name: Auto-format code with ruff
        run: |
          uv run ruff format src tests
          uv run ruff check --fix src tests

      - name: Format docstrings
        run: uv run pydocstringformatter -w --style=numpydoc src tests

      - name: Commit and push changes (if any)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "style: auto-format code with ruff and pydocstringformatter"
            git push
          else
            echo "No changes to commit"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
