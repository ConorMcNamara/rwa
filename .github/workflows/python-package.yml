# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python
#
# The Python version matrix is derived programmatically from the
# "Programming Language :: Python :: X.Y" classifiers in pyproject.toml.
# To test a new Python version, just add its classifier there.

name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      python-versions: ${{ steps.versions.outputs.versions }}
      primary: ${{ steps.versions.outputs.primary }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Derive Python versions from pyproject.toml classifiers
        id: versions
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, re, tomllib
          with open("pyproject.toml", "rb") as f:
              classifiers = tomllib.load(f)["project"]["classifiers"]
          pat = re.compile(r"^Programming Language :: Python :: (\d+\.\d+)$")
          vers = sorted(
              {m.group(1) for c in classifiers if (m := pat.match(c))},
              key=lambda v: tuple(map(int, v.split("."))),
          )
          if not vers:
              raise SystemExit("No 'Programming Language :: Python :: X.Y' classifiers found in pyproject.toml")
          print(f"versions={json.dumps(vers)}")
          print(f"primary={vers[0]}")
          EOF

  test:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.setup.outputs.python-versions) }}
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"

      - name: Lint with ruff
        run: |
          ruff check src tests

      - name: Check formatting with ruff
        run: |
          ruff format --check src tests

      - name: Type check with zuban
        run: |
          zuban check src/rwa

      - name: Test with pytest
        run: |
          pytest tests/ --cov=src/rwa --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == needs.setup.outputs.primary
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
