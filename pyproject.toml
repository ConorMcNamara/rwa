[project]
name = "johnson-rwa"
dynamic = ["version"]
description = "Performs Johnson's Relative Weights Analysis for Regression Models"
authors = [
    {name = "ConorMcNamara", email = "conor.s.mcnamara@gmail.com"}
]
maintainers = [
    {name = "ConorMcNamara", email = "conor.s.mcnamara@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["regression", "statistics", "relative-weights", "johnson", "machine-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
plot = [
    "plotly>=5.0.0",
]

# Development and test dependencies use PEP 735 dependency groups rather than
# extras, so they are not published as installable extras on PyPI.
# Install with `uv sync` (all groups) or `uv sync --group test`.
[dependency-groups]
test = [
    "pytest>=9.0.3",
    "pytest-cov>=4.0.0",
    "statsmodels>=0.14.0",
]
dev = [
    {include-group = "test"},
    "zuban>=0.6.0",
    "ruff>=0.1.0",
    "autopep8>=2.0.0",
    "pydocstringformatter>=0.7.0",
    "pandas-stubs>=2.0.0",
    "twine>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/ConorMcNamara/rwa"
Repository = "https://github.com/ConorMcNamara/rwa"
Issues = "https://github.com/ConorMcNamara/rwa/issues"
Changelog = "https://github.com/ConorMcNamara/rwa/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "rwa.__version__"}

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "ANN",    # flake8-annotations
    "D",      # pydocstyle (numpy convention)
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--cov=src/rwa",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "network: tests that require network access (may be skipped in CI)",
]

[tool.zuban]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
extra_checks = true
exclude_gitignore = true
mode = "default"  # Or "mypy"

# Recommended (and the default) for untyped code
untyped_strict_optional = true

# Mypy's default is "any", Zuban's "inferred"
untyped_function_return_mode = "inferred"

[[tool.zuban.overrides]]
module = ["plotly.*", "statsmodels.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
